name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - run: pip install -r service/requirements.txt scipy statsmodels matplotlib
      - run: pytest tests service/tests -q -rs
